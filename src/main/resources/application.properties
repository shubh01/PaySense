spring.application.name=PaySense

# spring boot port update
server.port = 8081

logging.level.org.springframework.ai.ollama=DEBUG

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:paysense_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Enable H2 Web Console (Optional: access via http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.ai.model.chat=ollama
paysense.chat.model=mistral:7b
spring.ai.ollama.base-url=http://localhost:11434

# Enable Ollama Auto-configurations
spring.ai.model.embedding=ollama

# Model used for generating vector representations (Embedding Model)
spring.ai.ollama.embedding.model=nomic-embed-text

# Enable DEBUG logging for all Spring AI packages
logging.level.org.springframework.ai=DEBUG

# Or target specific packages:
# Chat Client & Advisors
logging.level.org.springframework.ai.chat.client=DEBUG

#docker compose property
spring.docker.compose.stop.command=stop

#vector store property
spring.ai.vectorstore.qdrant.initialize-schema=true
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=paysense

logging.level.com.inn.paysense=DEBUG

#prompt sanitization model
prompt.sanitization.model=qwen3.5:4b

